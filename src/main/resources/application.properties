spring.application.name=tracking
spring.datasource.url=jdbc:postgresql://localhost:5432/railway_auth
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

# Mail (Google SMTP) - DO NOT COMMIT real password publicly. Use env var override in production.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=portalrailway@gmail.com
# For safety, you can override this with an ENV var at runtime: SPRING_MAIL_PASSWORD
spring.mail.password=${SPRING_MAIL_PASSWORD:CHANGE_ME_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true

# OTP settings
app.otp.length=6
app.otp.ttl-seconds=300
# Temporary dev mode (returns OTP in API response if email send fails). DISABLE IN PRODUCTION.
app.otp.dev-mode=true
